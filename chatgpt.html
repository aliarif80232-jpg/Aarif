<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT, google ai,p</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }
        body {
            background: #343541;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: #444654;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .header {
            background: #202123;
            color: white;
            padding: 15px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #565869;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            background: #10a37f;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .message.user .avatar {
            background: #5d5d6d;
        }
        .bubble {
            max-width: 70%;
            background: #343541;
            color: #ececf1;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .message.user .bubble {
            background: #19c37d;
            color: white;
        }
        .input-area {
            background: #40414f;
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #565869;
        }
        #apiKeyInput {
            flex: 2;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #343541;
            color: white;
            outline: none;
            font-size: 0.85rem;
        }
        #messageInput {
            flex: 5;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #343541;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        button {
            background: #19c37d;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #15a46a;
        }
        .info {
            font-size: 0.7rem;
            text-align: center;
            padding: 5px;
            color: #acacbe;
            background: #202123;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2c2d37;
        }
        ::-webkit-scrollbar-thumb {
            background: #565869;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">🤖 ChatGPT Clone (वेब संस्करण)</div>
    <div class="messages" id="messagesDiv">
        <div class="message assistant">
            <div class="avatar">AI</div>
            <div class="bubble">नमस्ते! मैं आपका सहायक हूँ। कृपया ऊपर अपनी OpenAI API key डालें और फिर मुझसे बात करें।</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="apiKeyInput" placeholder="🔑 OpenAI API Key (sk-...)" autocomplete="off">
        <input type="text" id="messageInput" placeholder="अपना सवाल लिखें..." autocomplete="off">
        <button id="sendBtn">➤ भेजें</button>
    </div>
    <div class="info">⚠️ ध्यान: API key आपके ब्राउज़र में ही रहेगी। कोड पूरी तरह फ्रंटएंड है।</div>
</div>

<script>
    const messagesDiv = document.getElementById('messagesDiv');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // चैट हिस्ट्री (सिर्फ मैसेज दिखाने के लिए)
    let conversation = [
        { role: "assistant", content: "नमस्ते! मैं आपका सहायक हूँ। कृपया ऊपर अपनी OpenAI API key डालें और फिर मुझसे बात करें।" }
    ];

    function addMessageToUI(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerText = role === 'user' ? 'YOU' : 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = content;
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function callChatGPT(userMessage) {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            addMessageToUI('assistant', '❌ कृपया पहले अपनी OpenAI API key डालें।');
            return;
        }

        // अस्थायी रूप से OpenAI API के लिए मैसेज तैयार करें
        const messagesForAPI = [
            { role: "system", content: "You are a helpful assistant." },
            ...conversation.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content })),
            { role: "user", content: userMessage }
        ];

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-3.5-turbo',
                    messages: messagesForAPI,
                    temperature: 0.7,
                    max_tokens: 500
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API key गलत है या क्रेडिट खत्म हो गए');
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;
            return reply;
        } catch (error) {
            console.error(error);
            return `❌ त्रुटि: ${error.message}`;
        }
    }

    sendBtn.addEventListener('click', async () => {
        const userText = messageInput.value.trim();
        if (!userText) return;

        // यूजर का मैसेज UI में दिखाएँ
        addMessageToUI('user', userText);
        conversation.push({ role: 'user', content: userText });
        messageInput.value = '';

        // थोड़ा सोचने का इफेक्ट
        const thinkingId = setTimeout(() => {
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message assistant';
            thinkingDiv.id = 'thinkingMsg';
            thinkingDiv.innerHTML = `<div class="avatar">AI</div><div class="bubble">🤔 सोच रहा हूँ...</div>`;
            messagesDiv.appendChild(thinkingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 200);

        const reply = await callChatGPT(userText);
        clearTimeout(thinkingId);
        const thinkingElem = document.getElementById('thinkingMsg');
        if (thinkingElem) thinkingElem.remove();

        addMessageToUI('assistant', reply);
        conversation.push({ role: 'assistant', content: reply });
    });

    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendBtn.click();
    });
</script>
</body>
</html>
